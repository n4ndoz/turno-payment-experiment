[project]
name = "turno-payment-experiment"
version = "0.1.0"
description = "Auditable notebook-first analysis of the Turno payment authorization experiment"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pandas>=2.2,<3.0",
    "numpy>=2.1,<3.0",
    "jupyterlab>=4,<5",
    "ipykernel>=6,<8",
    "plotly>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbformat>=5,<6", "nbclient>=0.10,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
